
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamMotion AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#090b14;color:#fff;font-family:Cairo,sans-serif}
.glass{background:#141827;border:1px solid #293047;border-radius:18px}
.input{width:100%;background:#0b1020;border:1px solid #343c55;border-radius:11px;padding:13px;color:white;outline:none}
.input:focus{border-color:#9b75ff}
.btn{background:linear-gradient(110deg,#7045e8,#ae5ce9);padding:12px 18px;border-radius:11px;font-weight:700;color:white}
.btn:disabled{opacity:.5}
.muted{color:#929bb2}
.hidden{display:none!important}
.navitem{padding:12px;border-radius:10px;color:#b5bed2;text-align:right;width:100%}
.navitem.active,.navitem:hover{background:#292044;color:white}
</style>
</head>
<body>

<div id="auth" class="min-h-screen flex items-center justify-center p-4">
<div class="glass w-full max-w-md p-7">
<div class="text-center mb-7">
<div class="text-4xl">✦</div>
<h1 class="text-3xl font-extrabold">DreamMotion <span class="text-violet-400">AI</span></h1>
<p class="muted mt-2">حوّل خيالك إلى فيديو مذهل</p>
</div>

<div class="flex gap-2 mb-5">
<button type="button" id="loginTab" class="btn flex-1">تسجيل الدخول</button>
<button type="button" id="signupTab" class="flex-1 rounded-xl bg-slate-800">حساب جديد</button>
</div>

<form id="authForm" class="space-y-4">
<div id="nameWrap" class="hidden">
<label class="block mb-2">الاسم</label>
<input id="name" class="input" placeholder="اسمك">
</div>
<div>
<label class="block mb-2">البريد الإلكتروني</label>
<input id="email" type="email" required class="input" placeholder="name@example.com">
</div>
<div>
<label class="block mb-2">كلمة المرور</label>
<input id="password" type="password" minlength="8" required class="input" placeholder="8 أحرف على الأقل">
</div>
<button type="submit" id="authSubmit" class="btn w-full">دخول إلى حسابي</button>
</form>
<p id="authMessage" class="text-sm text-center mt-4 muted"></p>
</div>
</div>

<div id="app" class="hidden min-h-screen">
<header class="border-b border-slate-800 px-5 py-4 flex justify-between items-center">
<h1 class="font-extrabold text-xl">✦ DreamMotion <span class="text-violet-400">AI</span></h1>
<button id="logout" class="bg-slate-800 px-4 py-2 rounded-lg">خروج</button>
</header>

<div class="max-w-7xl mx-auto p-4 md:p-8 grid md:grid-cols-[220px_1fr] gap-6">
<aside class="glass p-3 h-fit">
<button class="navitem active" data-page="create">✦ إنشاء فيديو</button>
<button class="navitem" data-page="library">▣ مكتبتي</button>
<div class="border-t border-slate-700 my-3"></div>
<div class="p-3">
<p class="text-xs muted">رصيدك التجريبي</p>
<div class="text-2xl font-bold mt-1">30 <span class="text-violet-400 text-sm">رصيد</span></div>
</div>
</aside>

<main>
<section id="createPage">
<h2 class="text-3xl font-extrabold mb-2">اصنع فيديوك القادم ✨</h2>
<p class="muted mb-6">حوّل أفكارك إلى مشاهد إبداعية.</p>

<div class="glass p-5 md:p-7">
<form id="projectForm">
<label class="block mb-2 font-bold">وصف الفيديو</label>
<textarea id="prompt" class="input h-36" required minlength="10" maxlength="3000" placeholder="اكتب وصف الفيديو الذي تريد إنشاءه..."></textarea>

<label class="block mt-5 mb-2">محرك الفيديو</label>
<select id="model" class="input">
<option value="kling">Kling AI</option>
<option value="veo">Google Veo</option>
<option value="sora">Sora</option>
<option value="runway">Runway</option>
</select>

<div class="grid grid-cols-2 gap-4 mt-4">
<div>
<label class="block mb-2">الأبعاد</label>
<select id="ratio" class="input">
<option value="9:16">عمودي 9:16</option>
<option value="16:9">أفقي 16:9</option>
<option value="1:1">مربع 1:1</option>
</select>
</div>
<div>
<label class="block mb-2">المدة</label>
<select id="duration" class="input">
<option value="5">5 ثوانٍ</option>
<option value="10">10 ثوانٍ</option>
<option value="15">15 ثانية</option>
</select>
</div>
</div>

<label class="block mt-5 mb-2">النمط</label>
<select id="style" class="input">
<option>واقعي</option>
<option>سينمائي</option>
<option>ASMR</option>
<option>أنمي</option>
<option>ثلاثي الأبعاد</option>
</select>

<button type="submit" id="saveProject" class="btn w-full mt-7">حفظ مشروع الفيديو ✦</button>
<p id="projectMessage" class="text-sm mt-4 text-center"></p>
</form>
</div>
</section>

<section id="libraryPage" class="hidden">
<h2 class="text-3xl font-extrabold mb-3">مكتبتي</h2>
<p class="muted mb-6">مشاريع الفيديو المحفوظة.</p>
<div id="videos" class="grid sm:grid-cols-2 gap-4"></div>
</section>
</main>
</div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ضع مفتاح Publishable Key الخاص بمشروعك
const SUPABASE_URL = "https://mjelvvxjnrtybefsrxgu.supabase.co";
const SUPABASE_KEY = "sb_publishable_q_MiHgc95qllN6ySh1MLog_pg5GPUX8";

const configured =
  SUPABASE_KEY.startsWith("sb_publishable_") ||
  (!SUPABASE_KEY.includes("sb_publishable_q_MiHgc95qllN6ySh1MLog_pg5GPUX8") &&
   SUPABASE_KEY.length > 20);

const supabase = configured
  ? createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const $ = id => document.getElementById(id);

let mode = "login";
let user = null;

function message(id, text, error = false) {
  $(id).textContent = text;
  $(id).style.color = error ? "#fb7185" : "#a78bfa";
}

function setMode(next) {
  mode = next;
  $("nameWrap").classList.toggle("hidden", mode !== "signup");

  $("loginTab").className =
    mode === "login" ? "btn flex-1" : "flex-1 rounded-xl bg-slate-800";

  $("signupTab").className =
    mode === "signup" ? "btn flex-1" : "flex-1 rounded-xl bg-slate-800";

  $("authSubmit").textContent =
    mode === "login" ? "دخول إلى حسابي" : "إنشاء حساب";

  message("authMessage", "");
}

$("loginTab").onclick = () => setMode("login");
$("signupTab").onclick = () => setMode("signup");

function showApp() {
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadVideos();
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!supabase) {
    message("authMessage", "أضف مفتاح Supabase العام أولاً.", true);
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  const name = $("name").value.trim();
  const btn = $("authSubmit");

  if (password.length < 8) {
    message("authMessage", "كلمة المرور يجب أن تكون 8 أحرف على الأقل.", true);
    return;
  }

  btn.disabled = true;
  message("authMessage", "جارٍ الاتصال...");

  try {
    if (mode === "signup") {
      const {data, error} = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: {name},
          emailRedirectTo: window.location.origin
        }
      });

      if (error) throw error;

      if (data.session && data.user) {
        user = data.user;
        showApp();
        message("authMessage", "تم إنشاء حسابك بنجاح!");
      } else {
        message("authMessage", "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيده.");
      }
    } else {
      const {data, error} = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      user = data.user;
      showApp();
    }
  } catch (error) {
    message("authMessage", error.message, true);
  } finally {
    btn.disabled = false;
  }
});

async function loadVideos() {
  if (!user || !supabase) return;

  const box = $("videos");
  box.textContent = "جارٍ تحميل المشاريع...";

  const {data, error} = await supabase
    .from("videos")
    .select("*")
    .eq("user_id", user.id)
    .order("created_at", {ascending:false});

  if (error) {
    box.textContent = "تعذر تحميل المشاريع: " + error.message;
    return;
  }

  box.innerHTML = "";

  if (!data || data.length === 0) {
    box.textContent = "لا توجد مشاريع محفوظة بعد.";
    return;
  }

  data.forEach(v => {
    const card = document.createElement("article");
    card.className = "glass p-4";

    const title = document.createElement("h3");
    title.className = "font-bold mb-2";
    title.textContent = v.model || "مشروع فيديو";

    const desc = document.createElement("p");
    desc.className = "muted text-sm";
    desc.textContent = v.prompt || "";

    const status = document.createElement("p");
    status.className = "text-xs text-violet-300 mt-3";
    status.textContent = "الحالة: " + (v.status || "draft");

    card.append(title, desc, status);
    box.append(card);
  });
}

$("projectForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!user || !supabase) {
    message("projectMessage", "سجّل الدخول أولاً.", true);
    return;
  }

  const btn = $("saveProject");
  btn.disabled = true;
  message("projectMessage", "جارٍ حفظ المشروع...");

  try {
    const {error} = await supabase.from("videos").insert({
      user_id: user.id,
      prompt: $("prompt").value.trim(),
      provider: "pending",
      model: $("model").value,
      status: "draft",
      aspect_ratio: $("ratio").value,
      duration: Number($("duration").value)
    });

    if (error) throw error;

    message("projectMessage", "تم حفظ مشروعك بنجاح ✓");
    $("prompt").value = "";
    await loadVideos();
  } catch (error) {
    message("projectMessage", error.message, true);
  } finally {
    btn.disabled = false;
  }
});

document.querySelectorAll("[data-page]").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll("[data-page]").forEach(x =>
      x.classList.remove("active")
    );

    btn.classList.add("active");

    $("createPage").classList.toggle("hidden", btn.dataset.page !== "create");
    $("libraryPage").classList.toggle("hidden", btn.dataset.page !== "library");

    if (btn.dataset.page === "library") loadVideos();
  };
});

$("logout").onclick = async () => {
  if (supabase) await supabase.auth.signOut();

  user = null;
  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
  setMode("login");
};

if (!configured) {
  message("authMessage", "أدخل مفتاح Supabase العام في الكود.", true);
} else {
  try {
    const {data, error} = await supabase.auth.getSession();
    if (error) throw error;

    if (data.session) {
      user = data.session.user;
      showApp();
    }
  } catch (error) {
    message("authMessage", error.message, true);
  }
}
</script>
</body>
</html>
